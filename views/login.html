<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Location Tracker - Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bulma/1.0.2/css/bulma.min.css">
    <style>
        body {
            display: grid;
            place-items: center;
            height: 100vh;
        }

        form {
            width: 300px;
            text-align: center;
        }
    </style>
</head>

<body>
    <form action="/login" method="post">
        <h1 class="title mb-1">Login</h1>
        <p class="subtitle is-6 mb-4 has-text-grey">Live Location Tracker</p>

        {{ if (hasError) }}
        <div class="notification is-danger is-light py-2 px-3 mb-4 is-size-7">
            Invalid username or password. Please try again.
        </div>
        {{ / }}

        {{ if (loggedOut) }}
        <div class="notification is-info is-light py-2 px-3 mb-4 is-size-7">
            You have been logged out successfully.
        </div>
        {{ / }}

        <div class="field">
            <input type="text" class="input" placeholder="Username" required name="username">
        </div>

        <div class="field">
            <input type="password" class="input" placeholder="Password" required name="password">
        </div>

        <input type="submit" value="Login" class="button is-fullwidth is-primary mb-3">

        <div class="is-size-7 has-text-grey">
            <p><strong>AutoGraph</strong></p>
            <p>Created by Soham</p>
        </div>
    </form>
</body>

</html>
